name: Temporary fast Whisper models bridge

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  download-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify multilingual Whisper models
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 -o ggml-tiny-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-tiny-q5_1.bin
          curl -L --fail --retry 5 --retry-delay 2 -o ggml-base-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-base-q5_1.bin
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  ggml-tiny-q5_1.bin" | sha256sum -c -
          echo "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  ggml-base-q5_1.bin" | sha256sum -c -
          ls -lh ggml-*-q5_1.bin

      - name: Upload tiny model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5_1
          path: ggml-tiny-q5_1.bin
          compression-level: 0
          retention-days: 1

      - name: Upload base model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: ggml-base-q5_1.bin
          compression-level: 0
          retention-days: 1
